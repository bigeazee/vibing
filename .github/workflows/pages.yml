name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it part-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build-free deploy
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # An EXCLUDE list, not an include list, and that is the whole point.
      #
      # List what to include and a contributor who adds a directory of site
      # assets gets a silently broken site: the missing thing is invisible
      # until somebody reports it. List what to exclude and the same
      # contributor gets a slightly untidy site: the extra thing is visible and
      # harmless. Choose the failure mode you can see.
      #
      # This is NOT a build step. Nothing is transformed, nothing is generated,
      # and every file served is byte-identical to the file in the repository.
      # Fork, edit one file, push, and the change is live with no tooling in
      # between - which is the whole of what the no-build-step rule protects.
      # Deleting files that were never part of the site does not touch it.
      #
      # The checkout is disposable. Nothing is deleted from the repository.
      - name: Trim non-site files from the artifact
        run: rm -rf docs tests .github CLAUDE.md package.json

      # What is left IS the site: index.html, src/ and assets/.
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
